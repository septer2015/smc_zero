[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-zero"
version = "0.1.0"
description = "SMC backtest foundation: D1 bias, H1 structure, M15 entries"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "backtesting",
    "pyarrow",
    "matplotlib",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "mypy"]
# The optimizer layer (Э7') is importable without optuna: only a real study needs the library.
# Pinned below 5.x: optuna 5 turns TPESampler's constant_liar/multivariate TPE on by default.
optimize = ["optuna>=4.9,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["reference"]

[tool.black]
line-length = 100

[tool.mypy]
strict = true
mypy_path = "src"
