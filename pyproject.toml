[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-zero"
version = "0.1.0"
description = "SMC backtest foundation: D1 bias, H1 structure, M15 entries"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "backtesting",
    "pyarrow",
    "matplotlib",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "mypy"]
# The optimizer layer (Э7') is importable without optuna: only a real study needs the library.
# Pinned below 5.x: optuna 5 turns TPESampler's constant_liar/multivariate TPE on by default.
optimize = ["optuna>=4.9,<5"]

[project.scripts]
# Э8': the two console faces of the project. ``scripts`` is a top-level package beside ``src``,
# so the package discovery below has to look in the repository root as well - otherwise the
# entry points would be registered and unimportable after an editable install.
smc-backtest = "scripts.run_backtest:main"
smc-optimize = "scripts.run_optimization:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["smc_zero*", "scripts*"]
exclude = ["tests*", "reference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``src`` for the package, ``.`` for the Э8' runners (``import scripts.run_backtest``), so the
# tests need neither an install nor a ``conftest.py`` that patches ``sys.path``.
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["reference"]

[tool.black]
line-length = 100

[tool.mypy]
strict = true
mypy_path = "src"
